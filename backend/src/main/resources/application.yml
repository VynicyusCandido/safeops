spring:
  application:
    name: safeops-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safeops}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 120

admin:
  email: ${ADMIN_EMAIL:admin@safeops.com}
  senha: ${ADMIN_SENHA:Admin@1234}
