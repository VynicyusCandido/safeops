services:
  postgres:
    image: postgres:16-alpine
    container_name: safeops-db
    environment:
      POSTGRES_DB: safeops
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d safeops"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
